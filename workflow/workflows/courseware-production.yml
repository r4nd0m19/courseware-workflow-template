schema_version: "1.0"

workflow:
  id: "courseware-production"
  name: "Courseware Production"
  version: "0.38.0"
  author: "courseware"
  description: "壳（独立 courseware-shell 工作流，先审）→ 内容包 → 参考源码直拷风格包 → 教学简报 → 人类可读脚本（整份一次审）→ 概念/自学/覆盖闸门 → 本课插画 → 组件复用规划/按页实现 → 分镜投影 → 任务 → 逐页构建/渲染/人工审 → 确定性 Alpha/Beta/Gold 汇总"

requires:
  speckit_version: ">=1.0.0"

inputs:
  lesson:
    type: string
    required: true
    prompt: "Lesson id/title"
  integration:
    type: string
    default: "auto"
    prompt: "Coding-agent integration for command/prompt steps (auto = project default; use codex or claude to select)"
  approver:
    type: string
    default: "teacher"
    prompt: "Name recorded as the human approver for component registration"
  content_pack:
    type: string
    required: true
    prompt: "Path to content-pack.json (R0-C output)"
  courseware_script:
    type: string
    required: true
    prompt: "Path to courseware.md (human-readable script; written by speckit.script)"
  concepts:
    type: string
    required: true
    prompt: "Path to concepts.yml (core-concept ledger; written with spec.md by speckit.specify)"
  review_sections:
    type: string
    required: true
    prompt: "Path to review-sections.yml (contiguous rendered-review groups; written by speckit.script)"
  component_registry:
    type: string
    default: "registry/index.json"
    prompt: "Path to component registry index (created/validated by the workflow)"
  component_staging:
    type: string
    default: "registry/staging"
    prompt: "Staging directory for components built for the current page, before that page is approved"
  storyboard:
    type: string
    required: true
    prompt: "Path to storyboard.yml (projected from courseware.md by speckit.plan)"
  style_pack:
    type: string
    required: true
    prompt: "Path to style-pack.manifest.json"
  style_pack_full:
    type: string
    required: true
    prompt: "Path to the frozen full style pack (style-pack.full.json)"
  style_pack_freeze:
    type: string
    default: "style-pack/style-pack.freeze.json"
    prompt: "Frozen style-pack manifest written by freeze-style-pack.mjs (verified against the full pack)"
  style_pack_source:
    type: string
    default: "style-pack/source/SOURCE.json"
    prompt: "Copied reference source manifest (CSS/JS hashes)"
  source_fidelity:
    type: string
    default: "style-pack/source/fidelity.json"
    prompt: "Source-fidelity contract (geometry, DOM selectors, animations, component types)"
  shell:
    type: string
    default: "shells/branch-choice"
    prompt: "Shell package id or directory (production deck chrome/renderer)"
  shell_slug:
    type: string
    default: "branch-choice"
    prompt: "Shell review slug used for review/shells/<slug>/ (must match the courseware-shell run)"
  shell_source:
    type: string
    default: "shells/branch-choice/SOURCE.json"
    prompt: "Copied shell source ledger (hash/fidelity anchor)"
  lesson_slug:
    type: string
    required: true
    prompt: "Lesson slug used for generated art provenance (e.g. 001-2d-arrays)"
  art_prompts:
    type: string
    required: true
    prompt: "Per-lesson illustration prompt file (slot -> prompt)"
  art_dir:
    type: string
    required: true
    prompt: "Directory for generated lesson illustrations and art-manifest.json"
  site_dir:
    type: string
    default: "prototype/shell-site"
    prompt: "Assembled shell site directory"
  deck_data:
    type: string
    required: true
    prompt: "Declarative deck.json generated from the approved script"
  deck_url:
    type: string
    required: true
    prompt: "URL of the built deck (dev or preview server)"
  voice_catalog:
    type: string
    default: "research/r0/voice-catalog.json"
    prompt: "Path to the Edge TTS voice catalog (voice ids, locale, rate, pitch)"
  narration_manifest:
    type: string
    default: "prototype/site/narration.json"
    prompt: "Generated narration manifest consumed by the deck"
  audio_dir:
    type: string
    default: "prototype/site/audio"
    prompt: "Directory for generated narration MP3 files"
  audio_url_prefix:
    type: string
    default: "/audio"
    prompt: "URL prefix under which the deck serves the audio directory"
  page_count:
    type: string
    default: "70"
    prompt: "Number of pages/slides for the overflow gate"
  density_authority:
    type: string
    default: "script"
    prompt: "Density authority: script (default; review before implementation) or page (legacy; rendered page review)"
  page_review_scope:
    type: string
    default: "visual-script"
    prompt: "Page review scope: visual-script (screenshot + approved script page) or evidence (legacy full bundle)"
  baseline_dir:
    type: string
    default: ""
    prompt: "Optional baseline screenshots directory"
  coverage_waivers:
    type: string
    default: ""
    prompt: "Optional waivers JSON path (required items only)"

steps:
  # ---------- inputs: per-lesson runtime paths ----------
  # One project may hold several lessons; every runtime directory must carry
  # the lesson segment so two runs cannot overwrite each other's ledgers,
  # screenshots or site. The wrapper exports the COURSEWARE_* values.
  - id: validate-lesson-paths
    type: shell
    run: "node workflow/tools/check-lesson-paths.mjs --lesson-slug {{ inputs.lesson_slug }} --site-dir \"{{ inputs.site_dir }}\" --narration \"{{ inputs.narration_manifest }}\" --audio-dir \"{{ inputs.audio_dir }}\" --art-dir \"{{ inputs.art_dir }}\" --baseline-dir \"{{ inputs.baseline_dir }}\""

  # The shell is generated and reviewed once in courseware-shell, before any
  # content pack exists. Production only verifies the hash-bound approval; it
  # must not ask the teacher to review the same shell again.
  - id: check-shell-approval
    type: shell
    run: "node workflow/tools/check-shell-approval.mjs --shell {{ inputs.shell }} --shell-slug {{ inputs.shell_slug }} --approval review/shells/{{ inputs.shell_slug }}/shell-approval.json"

  # ---------- inputs: content pack + style pack ----------
  - id: validate-content
    type: shell
    run: "node workflow/tools/validate-json.mjs workflow/schemas/content-pack.schema.json {{ inputs.content_pack }}"

  - id: validate-style-pack-full
    type: shell
    run: "node workflow/tools/validate-style-pack.mjs \"{{ inputs.style_pack_full }}\" --check-baselines --freeze \"{{ inputs.style_pack_freeze }}\""

  # Reference source is copied, not reimplemented. This gate anchors the copied
  # CSS/JS hashes and the fidelity contract before any content work starts.
  - id: validate-source-fidelity
    type: shell
    run: "node workflow/tools/check-source-fidelity.mjs --source {{ inputs.style_pack_source }} --fidelity {{ inputs.source_fidelity }} --source-only"

  # The shell package itself was validated and human-reviewed in the
  # courseware-shell workflow before this run. Do not duplicate that gate here.
  - id: ensure-registry
    type: shell
    run: "node workflow/tools/ensure-registry.mjs {{ inputs.component_registry }} {{ inputs.style_pack }}"

  - id: validate-registry
    type: shell
    run: "node workflow/tools/check-registry.mjs {{ inputs.component_registry }} --style-pack {{ inputs.style_pack }} --project-root ."

  # Deterministic input review: the gates above already established the
  # machine-checkable facts. This step turns those results plus the content-pack
  # rules into the review artifact without another model call.
  - id: self-review-inputs
    type: shell
    run: "node workflow/tools/build-self-review-inputs.mjs --lesson-slug {{ inputs.lesson_slug }} --content {{ inputs.content_pack }} --style {{ inputs.style_pack }} --style-full {{ inputs.style_pack_full }} --style-freeze {{ inputs.style_pack_freeze }} --source {{ inputs.style_pack_source }} --fidelity {{ inputs.source_fidelity }} --registry {{ inputs.component_registry }} --shell-ok true --shell-review review/shells/{{ inputs.shell_slug }}/shell-preview.md --out review/{{ inputs.lesson_slug }}/self-review-inputs.json --md review/{{ inputs.lesson_slug }}/self-review-inputs.md"

  - id: check-self-review-inputs
    type: shell
    run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-inputs.json"

  - id: check-review-ai-config
    type: shell
    run: "node workflow/tools/review-ai.mjs --check-config"

  # ---------- teaching brief ----------
  - id: brief
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.lesson }} --lesson-slug {{ inputs.lesson_slug }} --no-self-review"

  # The concept ledger is authored with the brief. Validate its schema and
  # source refs here, before any page exists; the slide-level coverage gate
  # runs again after the script is written.
  - id: validate-concepts-ledger
    type: shell
    run: "node workflow/tools/check-concepts.mjs --ledger-only {{ inputs.content_pack }} --concepts {{ inputs.concepts }}"

  - id: build-brief-review-evidence
    type: shell
    run: "node workflow/tools/build-brief-review-evidence.mjs --lesson-slug {{ inputs.lesson_slug }} --content {{ inputs.content_pack }} --style {{ inputs.style_pack }} --concepts {{ inputs.concepts }} --constitution .specify/memory/constitution.md --inputs-review review/{{ inputs.lesson_slug }}/self-review-inputs.json --review-dir review/{{ inputs.lesson_slug }} --out review/{{ inputs.lesson_slug }}/brief-review-evidence.json --review-json review/{{ inputs.lesson_slug }}/self-review-brief.json --md review/{{ inputs.lesson_slug }}/self-review-brief.md"

  - id: self-review-brief
    type: shell
    timeout: 300
    run: "node workflow/tools/review-ai.mjs --mode brief --evidence review/{{ inputs.lesson_slug }}/brief-review-evidence.json --review-json review/{{ inputs.lesson_slug }}/self-review-brief.json --md review/{{ inputs.lesson_slug }}/self-review-brief.md"

  - id: check-self-review-brief
    type: shell
    run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-brief.json"

  # The brief is an internal teaching-design artifact. The first human content
  # review is the whole courseware script below; do not add a separate gate.

  # ---------- courseware script (human-readable source of truth) ----------
  - id: script
    command: speckit.script
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.lesson }} --lesson-slug {{ inputs.lesson_slug }} --no-self-review"

  - id: validate-script-draft
    type: shell
    run: "node workflow/tools/check-script.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.style_pack }} {{ inputs.component_registry }}"

  # Content coverage is ID-based, so it can pass while the concept named by a
  # content item is never actually explained on screen. This gate compares the
  # ledger's mustAppear phrases against the introducing slide's 屏幕内容.
  - id: validate-concepts-draft
    type: shell
    run: "node workflow/tools/check-concepts.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} --concepts {{ inputs.concepts }}"

  # Self-study audit runs on a structurally valid draft, before any human
  # script review. It reports gaps and writes a separate proposal; it must not
  # edit courseware.md or expand the page count on its own.
  - id: self-study-audit
    command: speckit.self-study-audit
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.lesson }} --lesson-slug {{ inputs.lesson_slug }} --no-self-review"

  - id: check-self-study
    type: shell
    run: "node workflow/tools/check-self-study.mjs review/{{ inputs.lesson_slug }}/self-study-audit.json --script {{ inputs.courseware_script }}"

  # The self-study audit is applied automatically. The whole-script review
  # below is the teacher's first content review and sees the final text.
  - id: apply-self-study-audit
    type: shell
    run: "node workflow/tools/apply-self-study-audit.mjs --audit review/{{ inputs.lesson_slug }}/self-study-audit.json --script {{ inputs.courseware_script }} --approved-by \"{{ inputs.approver }}\" --record review/{{ inputs.lesson_slug }}/self-study-apply.json"

  - id: validate-script
    type: shell
    run: "node workflow/tools/check-script.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.style_pack }} {{ inputs.component_registry }}"

  - id: validate-concepts
    type: shell
    run: "node workflow/tools/check-concepts.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} --concepts {{ inputs.concepts }}"

  # Independent of the content pack's own option order: the script must not put
  # every correct answer in the same display position. The content pack lists the
  # correct option first, so copying that order makes every answer A.
  - id: quiz-keys-script
    type: shell
    run: "node workflow/tools/check-quiz-keys.mjs {{ inputs.courseware_script }} --content {{ inputs.content_pack }}"

  # Build one compact evidence bundle so the script review reads the per-slide
  # script fields and gate results once, instead of re-reading courseware.md,
  # the content pack, style pack and registry. The skeleton JSON already has
  # hashes and automated checks; the AI fills only judgment fields.
  - id: build-script-review-evidence
    type: shell
    run: "node workflow/tools/build-script-review-evidence.mjs --lesson-slug {{ inputs.lesson_slug }} --script {{ inputs.courseware_script }} --storyboard {{ inputs.storyboard }} --content {{ inputs.content_pack }} --style {{ inputs.style_pack }} --concepts {{ inputs.concepts }} --registry {{ inputs.component_registry }} --review-sections {{ inputs.review_sections }} --review-dir review/{{ inputs.lesson_slug }} --density-authority {{ inputs.density_authority }} --evidence-out review/{{ inputs.lesson_slug }}/self-review-script-evidence.json --out review/{{ inputs.lesson_slug }}/self-review-script.json --md review/{{ inputs.lesson_slug }}/self-review-script.md"

  - id: self-review-script
    type: shell
    timeout: 300
    run: "node workflow/tools/review-ai.mjs --mode script --evidence review/{{ inputs.lesson_slug }}/self-review-script-evidence.json --review-json review/{{ inputs.lesson_slug }}/self-review-script.json --md review/{{ inputs.lesson_slug }}/self-review-script.md"

  - id: check-self-review-script
    type: shell
    run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-script.json --script {{ inputs.courseware_script }} --role script --density-authority {{ inputs.density_authority }} --concepts {{ inputs.concepts }}"

  # The teacher reviews the lesson, not the production metadata. Render a
  # deterministic view with screen content, narration, transition and a
  # one-line student-action summary; the full courseware.md remains the single
  # source of truth and is still what the approval ledger binds.
  - id: render-teacher-script
    type: shell
    run: "node workflow/tools/render-teacher-script.mjs {{ inputs.courseware_script }} --out review/{{ inputs.lesson_slug }}/courseware.teacher.md"

  - id: review-script
    type: gui-gate
    message: "Review the teacher-facing courseware script: per-screen content, narration, transition, and the one-line student action."
    show_file: "review/{{ inputs.lesson_slug }}/courseware.teacher.md"
    options: [approve, reject]
    on_reject: abort

  # The gate above is the only whole-script human review. Once it passes, this
  # mechanical step records the approval and flips DRAFT -> APPROVED so later
  # stages may implement the script. It never decides the verdict itself.
  - id: approve-script
    type: shell
    run: "node workflow/tools/approve-script.mjs {{ inputs.courseware_script }} --approved-by \"{{ inputs.approver }}\" --gate-choice \"{{ steps.review-script.output.choice }}\" --gate-step review-script --run-id \"{{ context.run_id }}\" --out review/{{ inputs.lesson_slug }}/script-approval.json"

  # The ledger written above is the only proof downstream tools accept. This
  # step re-reads it and fails the run immediately if the gate choice, the
  # whole-file hash or any slide hash is wrong, instead of discovering it
  # several stages later.
  - id: verify-script-approval
    type: shell
    run: "node workflow/tools/check-script-approval.mjs {{ inputs.courseware_script }} --expect-run \"{{ context.run_id }}\""

  # ---------- per-lesson shell illustrations ----------
  # The shell ships reference mascots only as generation references. A lesson
  # build must use its own generated variants; this stage writes the lesson's
  # prompts, generates (or reuses) the images, and gates their provenance.
  # `prepare-shell-site` and `build-shell-site` are fail-closed on missing art.
  - id: shell-art-brief
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Write the per-lesson illustration prompt file ({{ inputs.art_prompts }}) for shell
      "{{ inputs.shell }}". Read the shell package (shell.json, reference crops), the approved
      courseware.md, storyboard.yml, spec.md, content pack and component plan.
      For every slot in shell.assets.illustrations, write one prompt that:
      - describes a character clearly DIFFERENT from the shell's reference crop: change the face,
        hairstyle, outfit colors and one accessory;
      - ties the character and its props to this lesson's subject ({{ inputs.lesson }});
      - keeps the same blocky pixel-art style and palette family, full body, plain white background;
      - forbids text, watermark, border and drop shadow, and forbids copying the reference exactly.
      Write valid JSON: { "schemaVersion": "1.0", "lesson": "{{ inputs.lesson_slug }}",
      "prompts": { "<slot>": "<prompt>" } }. Cover every slot; no TODO/TBD.
      Do not generate images yet. Do not edit the shell package.

  - id: build-shell-art
    type: shell
    run: "node workflow/tools/generate-shell-art.mjs --shell {{ inputs.shell }} --lesson {{ inputs.lesson_slug }} --lesson-title \"{{ inputs.lesson }}\" --prompt-file {{ inputs.art_prompts }} --out {{ inputs.art_dir }} --reuse"

  - id: check-shell-art
    type: shell
    run: "node workflow/tools/check-shell-art.mjs --shell {{ inputs.shell }} --art {{ inputs.art_dir }}/art-manifest.json --require-all"

  # The generated illustrations are checked deterministically here and shown
  # on every rendered page; the page review is the teacher's art review. Do not
  # add a separate illustration gate.

  # ---------- narration (Edge TTS, derived from the approved script) ----------
  # The script remains the source of truth: each slide's narration block is
  # extracted, normalized for speech (C++ -> "C 加加", cin -> "C in", ...), and
  # rendered to MP3 for every voice in the catalog. The manifest records the
  # script hash and spoken text, so stale or hand-edited audio fails the check.
  - id: build-narration
    type: shell
    run: "node workflow/tools/build-narration.mjs {{ inputs.courseware_script }} --voices {{ inputs.voice_catalog }} --out {{ inputs.narration_manifest }} --audio-dir {{ inputs.audio_dir }} --url-prefix {{ inputs.audio_url_prefix }}"

  - id: check-narration
    type: shell
    run: "node workflow/tools/check-narration.mjs {{ inputs.courseware_script }} {{ inputs.narration_manifest }} --audio-root {{ inputs.audio_dir }}"

  # ---------- component reuse / generation ----------
  - id: component-plan
    command: speckit.component-plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.lesson }} --lesson-slug {{ inputs.lesson_slug }} --no-self-review"

  - id: validate-component-plan
    type: shell
    run: "node workflow/tools/check-component-plan.mjs {{ inputs.courseware_script }} {{ inputs.style_pack }} {{ inputs.component_registry }}"

  - id: build-component-plan-review-evidence
    type: shell
    run: "node workflow/tools/build-component-plan-review-evidence.mjs --lesson-slug {{ inputs.lesson_slug }} --script {{ inputs.courseware_script }} --style {{ inputs.style_pack }} --registry {{ inputs.component_registry }} --approval review/{{ inputs.lesson_slug }}/script-approval.json --review-dir review/{{ inputs.lesson_slug }} --out review/{{ inputs.lesson_slug }}/component-plan-review-evidence.json --review-json review/{{ inputs.lesson_slug }}/self-review-component-plan.json --md review/{{ inputs.lesson_slug }}/self-review-component-plan.md"

  - id: self-review-component-plan
    type: shell
    timeout: 300
    run: "node workflow/tools/review-ai.mjs --mode component-plan --evidence review/{{ inputs.lesson_slug }}/component-plan-review-evidence.json --review-json review/{{ inputs.lesson_slug }}/self-review-component-plan.json --md review/{{ inputs.lesson_slug }}/self-review-component-plan.md"

  - id: check-self-review-component-plan
    type: shell
    run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-component-plan.json"

  # Component briefs are checked here on paper. The teacher reviews each new
  # component with the first page that uses it; there is no separate component
  # gallery gate.
  # Implementation is not global: each page builds only the components it
  # needs into the staging area, the page site bundles them for rendered
  # review, and registration into core happens only after that page is
  # approved. This keeps the teacher's review focused on a page (its content,
  # interaction and any new components).

  # ---------- storyboard projection ----------
  # The storyboard is a deterministic projection of the approved script; no AI
  # call is needed. plan.md is optional for manual use and is not generated by
  # the production workflow.
  - id: storyboard
    type: shell
    run: "node workflow/tools/script-to-storyboard.mjs {{ inputs.courseware_script }} --out {{ inputs.storyboard }}"

  - id: validate-storyboard
    type: shell
    run: "node workflow/tools/validate-json.mjs workflow/schemas/storyboard.schema.json {{ inputs.storyboard }}"

  - id: script-storyboard-parity
    type: shell
    run: "node workflow/tools/script-to-storyboard.mjs {{ inputs.courseware_script }} --check {{ inputs.storyboard }}"

  # One reference adaptation map per lesson. It is generated after the
  # storyboard exists and before the page loop, so every page review can read
  # the same mapping instead of re-reading shells/<id>/source/lesson.js.
  - id: build-reference-adaptation
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Build the per-lesson reference adaptation map (stage: reference-adaptation).
      Read the approved courseware.md ({{ inputs.courseware_script }}), the projected
      storyboard.yml ({{ inputs.storyboard }}), the shell package ({{ inputs.shell }}:
      shell.json, source/lesson.js, reference/), concepts.yml ({{ inputs.concepts }})
      and the content pack ({{ inputs.content_pack }}).
      Identify every visible item of the reference lesson — titles, leads, questions,
      options, code, table cells, labels, example values, character props and images —
      and map it to this lesson's equivalent. Write
      review/{{ inputs.lesson_slug }}/reference-adaptation.json per
      workflow/schemas/reference-adaptation.schema.json and a readable
      review/{{ inputs.lesson_slug }}/reference-adaptation.md table.
      Rules:
      - Use stable ids RA01, RA02, …
      - `pages` lists the lesson slide ids where the replacement appears.
      - `residue: "replace"` for reference-specific content that must not appear;
        `residue: "allow"` only for generic C++ syntax or shell chrome that may remain.
      - Fill `lessonText` with the exact visible replacement when it is a literal
        string; the deterministic residue check will require it.
      - Put reference content intentionally not carried over in `unmapped` with a
        reason; mark it `residue: "replace"` if seeing it in the lesson is residue.
      - Do not edit the shell, the script or the deck.
      Verdict: write the files; do not request a human review here.

  - id: check-reference-adaptation
    type: shell
    run: "node workflow/tools/check-reference-adaptation.mjs review/{{ inputs.lesson_slug }}/reference-adaptation.json --storyboard {{ inputs.storyboard }} --script {{ inputs.courseware_script }} --shell {{ inputs.shell }} --lesson-slug {{ inputs.lesson_slug }}"

  # Re-check the ledger against the projected storyboard: the introducing
  # slide must reference the concept's source items and must not be SKIP.
  - id: concepts-storyboard
    type: shell
    run: "node workflow/tools/check-concepts.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.storyboard }} --concepts {{ inputs.concepts }}"

  - id: content-coverage
    type: shell
    run: "node workflow/tools/check-coverage.mjs {{ inputs.content_pack }} {{ inputs.storyboard }} {{ inputs.coverage_waivers }}"

  - id: style-vocabulary
    type: shell
    run: "node workflow/tools/check-vocabulary.mjs {{ inputs.storyboard }} {{ inputs.style_pack }} {{ inputs.component_registry }} --script {{ inputs.courseware_script }}"

  - id: teaching-gates
    type: shell
    run: "node workflow/tools/check-teaching.mjs {{ inputs.storyboard }} {{ inputs.content_pack }}"

  # The storyboard is a mechanical projection of the approved script. The shell
  # checks below are authoritative; no AI self-review or teacher gate is needed.

  - id: check-review-sections
    type: shell
    run: "node workflow/tools/check-review-sections.mjs {{ inputs.review_sections }} {{ inputs.storyboard }} --script {{ inputs.courseware_script }} --require-approved"

  - id: record-component-usage
    type: shell
    run: "node workflow/tools/record-component-usage.mjs --registry {{ inputs.component_registry }} --storyboard {{ inputs.storyboard }} --lesson {{ inputs.lesson }} --script {{ inputs.courseware_script }}"

  # ---------- tasks ----------
  # tasks.md is a deterministic internal breakdown; no AI command or self-review.
  - id: tasks
    type: shell
    run: "node workflow/tools/build-tasks.mjs --lesson {{ inputs.lesson }} --sections {{ inputs.review_sections }} --storyboard {{ inputs.storyboard }} --out specs/{{ inputs.lesson_slug }}/tasks.md"

  # Fail before building components/pages if the single-shot review model is
  # not configured. The page reviewer is a direct HTTP call, not a coding agent;
  # it needs an explicit vision-capable model/endpoint.
  - id: check-page-review-config
    type: shell
    run: "node workflow/tools/page-review-ai.mjs --check-config"

  # ---------- component prebuild ----------
  # Build all declared new/extend components that are neither registered nor
  # staged, once before the page loop. The page loop then only reviews/registers
  # them with their first-use page; it does not stall that page for a long build.
  - id: list-missing-components
    type: shell
    run: "node workflow/tools/list-missing-components.mjs --script {{ inputs.courseware_script }} --storyboard {{ inputs.storyboard }} --sections {{ inputs.review_sections }} --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }}"
    output_format: json

  - id: prebuild-missing-components
    type: if
    condition: "{{ steps.list-missing-components.output.data.needsPrebuild }}"
    then:
      - id: build-all-missing-components
        command: speckit.component-build
        integration: "{{ inputs.integration }}"
        input:
          args: "--prebuild --components {{ steps.list-missing-components.output.data.ids | join(',') }} --staging {{ inputs.component_staging }} --lesson-slug {{ inputs.lesson_slug }} --no-self-review"

  # ---------- page-by-page implementation + rendered review ----------
  # One whole-script gate above; from here each page is implemented, rendered,
  # self-reviewed and human-reviewed before the next page starts. A rejected
  # page aborts the run; after fixing only that page, resume. Approved pages
  # carry script hashes and cannot change silently. review-sections.yml lists
  # one slide per section, so the section loop is the page loop.
  - id: section_review_loop
    type: do-while
    condition: "{{ not steps.advance_section.output.data.done }}"
    max_iterations: 30
    steps:
      - id: advance_section
        type: shell
        run: "node workflow/tools/next-section.mjs --sections {{ inputs.review_sections }} --storyboard {{ inputs.storyboard }} --approvals review/{{ inputs.lesson_slug }}/page-approvals.json"
        output_format: json

      - id: section_body
        type: if
        condition: "{{ not steps.advance_section.output.data.done }}"
        then:
          - id: section-freeze-check
            type: shell
            run: "node workflow/tools/check-section-freeze.mjs --sections {{ inputs.review_sections }} --storyboard {{ inputs.storyboard }} --script {{ inputs.courseware_script }} --approvals review/{{ inputs.lesson_slug }}/page-approvals.json --screenshots screenshots/{{ inputs.lesson_slug }}"

          # Components are built on demand, one page at a time. Declared
          # new/extend components that this page needs are implemented into the
          # staging area, bundled into this page's site, and reviewed together
          # with the page. Nothing is registered core before the page gate.
          - id: load-page-components
            type: shell
            run: "node workflow/tools/list-section-components.mjs --script {{ inputs.courseware_script }} --storyboard {{ inputs.storyboard }} --sections {{ inputs.review_sections }} --section {{ steps.advance_section.output.data.section.id }} --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }}"
            output_format: json

          # Spec Kit re-runs a nested step's parent body on resume. Without
          # this guard, implement-section and the AI page self-review would
          # run again before review-page and rewrite the self-review JSON
          # (reviewedAt), changing the gate digest and discarding the
          # teacher's verdict. When this run already has a pending/decided
          # gate for review-page, skip straight back to the gate.
          - id: page-review-resume-guard
            type: shell
            run: "node workflow/tools/check-pending-gui-gate.mjs --step-id review-page"
            output_format: json

          - id: page-pre-review
            type: if
            condition: "{{ not steps.page-review-resume-guard.output.data.resume }}"
            then:
              - id: build-page-components
                type: if
                condition: "{{ steps.load-page-components.output.data.buildRequired }}"
                then:
                  - id: build-missing-page-components
                    command: speckit.component-build
                    integration: "{{ inputs.integration }}"
                    input:
                      args: "{{ inputs.lesson }} --section {{ steps.advance_section.output.data.section.id }} --slides {{ steps.advance_section.output.data.section.slides | join(',') }} --components {{ steps.load-page-components.output.data.missing | join(',') }} --staging {{ inputs.component_staging }} --lesson-slug {{ inputs.lesson_slug }} --no-self-review"

              - id: check-page-components
                type: if
                condition: "{{ steps.load-page-components.output.data.needsWork }}"
                then:
                  - id: validate-staged-page-components
                    type: shell
                    run: "node workflow/tools/check-staged-components.mjs --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }} --project-root . --script {{ inputs.courseware_script }}"

                  # Component review is merged into the page self-review below:
                  # it reads the staged packages directly. Do not run a separate
                  # AI component-review call before the page review.

              # The site is rebuilt from the shell package after every section:
              # build-shell-site runs the art provenance gate, assembles the deck,
              # injects the component bundle/host, and verifies the rendered site.
              - id: implement-section
                command: speckit.implement
                integration: "{{ inputs.integration }}"
                input:
                  args: "{{ inputs.lesson }} --section {{ steps.advance_section.output.data.section.id }} --sections {{ inputs.review_sections }} --storyboard {{ inputs.storyboard }} --deck-data {{ inputs.deck_data }} --staging {{ inputs.component_staging }} --lesson-slug {{ inputs.lesson_slug }} --no-self-review"

              # Refresh narration after implementation in case the section script
              # changed. Existing MP3s are reused when their spoken text is unchanged.
              - id: build-section-narration
                type: shell
                run: "node workflow/tools/build-narration.mjs {{ inputs.courseware_script }} --voices {{ inputs.voice_catalog }} --out {{ inputs.narration_manifest }} --audio-dir {{ inputs.audio_dir }} --url-prefix {{ inputs.audio_url_prefix }}"

              - id: section-shell-build
                type: shell
                run: "node workflow/tools/build-shell-site.mjs --script {{ inputs.courseware_script }} --shell {{ inputs.shell }} --deck {{ inputs.deck_data }} --art {{ inputs.art_dir }}/art-manifest.json --narration {{ inputs.narration_manifest }} --audio-dir {{ inputs.audio_dir }} --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }} --out {{ inputs.site_dir }} --force"

              - id: section-narration-gate
                type: shell
                run: "node workflow/tools/check-narration.mjs {{ inputs.courseware_script }} {{ inputs.narration_manifest }} --audio-root {{ inputs.audio_dir }} --only {{ steps.advance_section.output.data.section.slides | join(',') }}"

              - id: load-section-screens
                type: shell
                run: "node workflow/tools/list-approved-screens.mjs {{ inputs.storyboard }} --sections {{ inputs.review_sections }} --section {{ steps.advance_section.output.data.section.id }}"
                output_format: json

              - id: build-section-screens
                type: fan-out
                items: "{{ steps.load-section-screens.output.data }}"
                max_concurrency: 2
                step:
                  id: build-one-section-screen
                  type: shell
                  run: "node workflow/tools/build-screen.mjs {{ item.id }} --url \"{{ inputs.deck_url }}\" --storyboard \"{{ inputs.storyboard }}\" --script {{ inputs.courseware_script }} --deck {{ inputs.deck_data }} --out screenshots/{{ inputs.lesson_slug }}"

              - id: section-deck-data-gate
                type: shell
                run: "node workflow/tools/check-deck-data.mjs --script {{ inputs.courseware_script }} --url \"{{ inputs.deck_url }}\" --shell {{ inputs.shell }} --storyboard {{ inputs.storyboard }} --sections {{ inputs.review_sections }} --section {{ steps.advance_section.output.data.section.id }} --fidelity {{ inputs.source_fidelity }} --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }}"

              # Shell, illustration and source-fidelity checks are static for the
              # lesson and already ran before the page loop; build-shell-site
              # verifies the site again. Rendered/overflow/overlap checks are in
              # build-page-evidence below, so they are not run twice per page.

              - id: section-baseline-gate
                type: shell
                run: "node workflow/tools/check-baseline.mjs screenshots/{{ inputs.lesson_slug }} --baseline \"{{ inputs.baseline_dir }}\" --include \"{{ steps.advance_section.output.data.section.slides | join(',') }}\""

              # The script is approved and frozen; whole-script checks already ran
              # before the gate and do not need to repeat for every page.

              # A page may be built faithfully while still dropping the concept it
              # was supposed to introduce. Gate this page against the ledger before
              # its rendering can be approved.
              - id: section-concepts-gate
                type: shell
                run: "node workflow/tools/check-concepts.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.storyboard }} --concepts {{ inputs.concepts }} --slides {{ steps.advance_section.output.data.section.slides | join(',') }}"

              # Check the implemented deck, not only the script: a relettering or a
              # hand edit during implementation must not restore the all-A order.
              - id: section-quiz-keys-gate
                type: shell
                run: "node workflow/tools/check-quiz-keys.mjs {{ inputs.deck_data }} --slides {{ steps.advance_section.output.data.section.slides | join(',') }}"

              # One evidence bundle for the AI self-review. The shell gates above
              # already passed; this captures their results plus density, quiz,
              # narration and screenshot metadata so the review step only reads
              # one JSON instead of re-running commands/reading every file.
              - id: build-page-evidence
                type: shell
                run: "node workflow/tools/build-page-evidence.mjs --lesson-slug {{ inputs.lesson_slug }} --script {{ inputs.courseware_script }} --content {{ inputs.content_pack }} --storyboard {{ inputs.storyboard }} --sections {{ inputs.review_sections }} --section {{ steps.advance_section.output.data.section.id }} --deck {{ inputs.deck_data }} --screenshots screenshots/{{ inputs.lesson_slug }} --url \"{{ inputs.deck_url }}\" --concepts {{ inputs.concepts }} --narration {{ inputs.narration_manifest }} --audio-root {{ inputs.audio_dir }} --reference-source \"{{ inputs.shell }}/source/lesson.js\" --reference-adaptation review/{{ inputs.lesson_slug }}/reference-adaptation.json --density-authority {{ inputs.density_authority }} --review-scope {{ inputs.page_review_scope }} --script-review review/{{ inputs.lesson_slug }}/self-review-script.json --out review/{{ inputs.lesson_slug }}/page-evidence-{{ steps.advance_section.output.data.section.id }}.json"

              - id: page-review-cache
                type: shell
                run: "node workflow/tools/page-review-cache.mjs --mode check --lesson-slug {{ inputs.lesson_slug }} --section {{ steps.advance_section.output.data.section.id }} --evidence review/{{ inputs.lesson_slug }}/page-evidence-{{ steps.advance_section.output.data.section.id }}.json --deck {{ inputs.deck_data }} --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }} --unregistered \"{{ steps.load-page-components.output.data.unregistered | join(',') }}\" --cache-dir review/{{ inputs.lesson_slug }}/page-review-cache --review-json review/{{ inputs.lesson_slug }}/self-review-page-{{ steps.advance_section.output.data.section.id }}.json --json"
                output_format: json

              - id: page-review-ai
                type: if
                condition: "{{ not steps.page-review-cache.output.data.reuse }}"
                then:
                  # Single-shot model call, NOT a coding agent. The tool reads
                  # the evidence bundle, inlines the AI screenshots, makes one
                  # HTTP request, validates one structured JSON object and
                  # merges it into the skeleton. The model gets no tools and
                  # cannot read the repository or run commands.
                  - id: self-review-page
                    type: shell
                    timeout: 600
                    run: "node workflow/tools/page-review-ai.mjs --lesson-slug {{ inputs.lesson_slug }} --section {{ steps.advance_section.output.data.section.id }} --evidence review/{{ inputs.lesson_slug }}/page-evidence-{{ steps.advance_section.output.data.section.id }}.json --review-json review/{{ inputs.lesson_slug }}/self-review-page-{{ steps.advance_section.output.data.section.id }}.json --density-authority {{ inputs.density_authority }} --review-scope {{ inputs.page_review_scope }} --component-staging {{ inputs.component_staging }} --unregistered \"{{ steps.load-page-components.output.data.unregistered | join(',') }}\""

              - id: render-page-review
                type: shell
                run: "node workflow/tools/render-self-review-md.mjs review/{{ inputs.lesson_slug }}/self-review-page-{{ steps.advance_section.output.data.section.id }}.json --out review/{{ inputs.lesson_slug }}/self-review-page-{{ steps.advance_section.output.data.section.id }}.md --screenshots screenshots/{{ inputs.lesson_slug }} --slides {{ steps.advance_section.output.data.section.slides | join(',') }}"

              - id: check-self-review-page
                type: shell
                run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-page-{{ steps.advance_section.output.data.section.id }}.json --script {{ inputs.courseware_script }} --storyboard {{ inputs.storyboard }} --slides {{ steps.advance_section.output.data.section.slides | join(',') }} --concepts {{ inputs.concepts }} --role page --density-authority {{ inputs.density_authority }} --require-reference-adaptation"

              - id: page-review-cache-store
                type: shell
                run: "node workflow/tools/page-review-cache.mjs --mode store --lesson-slug {{ inputs.lesson_slug }} --section {{ steps.advance_section.output.data.section.id }} --evidence review/{{ inputs.lesson_slug }}/page-evidence-{{ steps.advance_section.output.data.section.id }}.json --deck {{ inputs.deck_data }} --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }} --unregistered \"{{ steps.load-page-components.output.data.unregistered | join(',') }}\" --cache-dir review/{{ inputs.lesson_slug }}/page-review-cache --review-json review/{{ inputs.lesson_slug }}/self-review-page-{{ steps.advance_section.output.data.section.id }}.json"

          - id: review-page
            type: gui-gate
            message: "Review rendered page {{ steps.advance_section.output.data.section.id }} · {{ steps.advance_section.output.data.section.title }} ({{ steps.advance_section.output.data.section.slides | join(', ') }}). Components: {{ steps.load-page-components.output.data.summary }}. Open the fixed 1440×900 player at {{ inputs.deck_url }}player.html (zoom only scales the whole canvas; it does not reflow) and use the outline to jump to this page; per-page screenshots and the self-review are in the attached file. Check script fidelity, interaction evidence, no overflow, narration playback/voice selection, and the outline. Approving this page also approves its new components into core; reject to rework just this page (nothing is registered)."
            show_file: "review/{{ inputs.lesson_slug }}/self-review-page-{{ steps.advance_section.output.data.section.id }}.md"
            artifacts:
              - "review/{{ inputs.lesson_slug }}/page-evidence-{{ steps.advance_section.output.data.section.id }}.json"
              - "review/{{ inputs.lesson_slug }}/reference-adaptation.json"
              - "review/{{ inputs.lesson_slug }}/reference-adaptation.md"
            options: [approve, reject]
            on_reject: abort

          # Registration happens only after the page gate approves. The page is
          # then rebuilt from the registry alone, so the approved page provably
          # no longer depends on the staging area, and only then frozen.
          - id: register-page-components
            type: if
            condition: "{{ steps.load-page-components.output.data.needsWork }}"
            then:
              - id: register-staged-page-components
                type: shell
                run: "node workflow/tools/register-staged-components.mjs --registry {{ inputs.component_registry }} --staging {{ inputs.component_staging }} --only {{ steps.load-page-components.output.data.unregistered | join(',') }} --lesson {{ inputs.lesson }} --approved-by \"{{ inputs.approver }}\" --project-root . --script {{ inputs.courseware_script }} --section {{ steps.advance_section.output.data.section.id }} --clean"

              - id: check-registry-after-page
                type: shell
                run: "node workflow/tools/check-registry.mjs {{ inputs.component_registry }} --style-pack {{ inputs.style_pack }} --project-root ."

              - id: section-shell-build-from-registry
                type: shell
                run: "node workflow/tools/build-shell-site.mjs --script {{ inputs.courseware_script }} --shell {{ inputs.shell }} --deck {{ inputs.deck_data }} --art {{ inputs.art_dir }}/art-manifest.json --narration {{ inputs.narration_manifest }} --audio-dir {{ inputs.audio_dir }} --registry {{ inputs.component_registry }} --out {{ inputs.site_dir }} --force"

              - id: section-deck-data-gate-after-register
                type: shell
                run: "node workflow/tools/check-deck-data.mjs --script {{ inputs.courseware_script }} --url \"{{ inputs.deck_url }}\" --shell {{ inputs.shell }} --storyboard {{ inputs.storyboard }} --sections {{ inputs.review_sections }} --section {{ steps.advance_section.output.data.section.id }} --fidelity {{ inputs.source_fidelity }} --registry {{ inputs.component_registry }}"

          - id: freeze-section
            type: shell
            run: "node workflow/tools/freeze-section.mjs --sections {{ inputs.review_sections }} --storyboard {{ inputs.storyboard }} --script {{ inputs.courseware_script }} --id {{ steps.advance_section.output.data.section.id }} --approved-by \"{{ inputs.approver }}\" --screenshots screenshots/{{ inputs.lesson_slug }} --approvals review/{{ inputs.lesson_slug }}/page-approvals.json"

  # ---------- whole-deck Alpha regression after every section is approved ----------
  - id: all-sections-frozen
    type: shell
    run: "node workflow/tools/check-section-freeze.mjs --sections {{ inputs.review_sections }} --storyboard {{ inputs.storyboard }} --script {{ inputs.courseware_script }} --approvals review/{{ inputs.lesson_slug }}/page-approvals.json --screenshots screenshots/{{ inputs.lesson_slug }} --require-all"

  # Assemble the final whole-deck site once, from the frozen deck, narration,
  # generated art and registry bundle, before the Alpha screenshots.
  - id: alpha-shell-build
    type: shell
    run: "node workflow/tools/build-shell-site.mjs --script {{ inputs.courseware_script }} --shell {{ inputs.shell }} --deck {{ inputs.deck_data }} --art {{ inputs.art_dir }}/art-manifest.json --narration {{ inputs.narration_manifest }} --audio-dir {{ inputs.audio_dir }} --registry {{ inputs.component_registry }} --out {{ inputs.site_dir }} --force"

  - id: load_approved_screens
    type: shell
    run: "node workflow/tools/list-approved-screens.mjs {{ inputs.storyboard }}"
    output_format: json

  - id: build-screens
    type: fan-out
    items: "{{ steps.load_approved_screens.output.data }}"
    max_concurrency: 2
    step:
      id: build-one-screen
      type: shell
      run: "node workflow/tools/build-screen.mjs {{ item.id }} --url \"{{ inputs.deck_url }}\" --storyboard \"{{ inputs.storyboard }}\" --script {{ inputs.courseware_script }} --deck {{ inputs.deck_data }} --out screenshots/{{ inputs.lesson_slug }}"

  - id: baseline-gate
    type: shell
    run: "node workflow/tools/check-baseline.mjs screenshots/{{ inputs.lesson_slug }} --baseline \"{{ inputs.baseline_dir }}\""

  - id: alpha-deck-data-gate
    type: shell
    run: "node workflow/tools/check-deck-data.mjs --script {{ inputs.courseware_script }} --url \"{{ inputs.deck_url }}\" --shell {{ inputs.shell }} --storyboard {{ inputs.storyboard }} --fidelity {{ inputs.source_fidelity }} --registry {{ inputs.component_registry }}"

  - id: alpha-source-fidelity-gate
    type: shell
    run: "node workflow/tools/check-source-fidelity.mjs --source {{ inputs.shell_source }} --source-only"

  # Generated artifacts are allowed to be rebuilt, but they must not be stale
  # at the whole-deck review: the bundle must match its registry input, and the
  # site must still map every lesson illustration to generated art.
  - id: alpha-bundle-gate
    type: shell
    run: "node workflow/tools/sync-deck-components.mjs --registry {{ inputs.component_registry }} --out {{ inputs.site_dir }}/components.bundle.js --css-out {{ inputs.site_dir }}/components.bundle.css --site {{ inputs.site_dir }} --check"

  - id: alpha-shell-gate
    type: shell
    run: "node workflow/tools/check-shell.mjs --shell {{ inputs.shell }} --site {{ inputs.site_dir }} --require-art"

  - id: alpha-shell-art-gate
    type: shell
    run: "node workflow/tools/check-shell-art.mjs --shell {{ inputs.shell }} --art {{ inputs.art_dir }}/art-manifest.json --site {{ inputs.site_dir }} --require-all"

  - id: alpha-narration-gate
    type: shell
    run: "node workflow/tools/check-narration.mjs {{ inputs.courseware_script }} {{ inputs.narration_manifest }} --audio-root {{ inputs.audio_dir }}"

  - id: alpha-script-gates
    type: shell
    run: "node workflow/tools/check-script.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.style_pack }} {{ inputs.component_registry }}"

  - id: alpha-concepts-gate
    type: shell
    run: "node workflow/tools/check-concepts.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.storyboard }} --concepts {{ inputs.concepts }}"

  - id: alpha-quiz-keys-gate
    type: shell
    run: "node workflow/tools/check-quiz-keys.mjs {{ inputs.deck_data }}"

  - id: alpha-parity-gate
    type: shell
    run: "node workflow/tools/script-to-storyboard.mjs {{ inputs.courseware_script }} --check {{ inputs.storyboard }}"

  - id: alpha-gates
    type: shell
    run: "node workflow/tools/check-overflow.mjs {{ inputs.deck_url }} --script {{ inputs.courseware_script }} --pages {{ inputs.page_count }}"

  # Alpha is a whole-deck aggregation, not a second visual review: every page
  # was already seen by the teacher and its self-review is on disk. The
  # expensive render/shell/art/narration gates already ran above and stopped
  # the run on failure, so this step aggregates their evidence deterministically.
  - id: self-review-alpha
    type: shell
    run: "node workflow/tools/build-self-review-alpha.mjs --lesson-slug {{ inputs.lesson_slug }} --script {{ inputs.courseware_script }} --storyboard {{ inputs.storyboard }} --content {{ inputs.content_pack }} --style {{ inputs.style_pack }} --concepts {{ inputs.concepts }} --registry {{ inputs.component_registry }} --sections {{ inputs.review_sections }} --approvals review/{{ inputs.lesson_slug }}/page-approvals.json --script-approval review/{{ inputs.lesson_slug }}/script-approval.json --deck {{ inputs.deck_data }} --screenshots screenshots/{{ inputs.lesson_slug }} --review-dir review/{{ inputs.lesson_slug }} --out review/{{ inputs.lesson_slug }}/self-review-alpha.json --md review/{{ inputs.lesson_slug }}/self-review-alpha.md"

  - id: check-self-review-alpha
    type: shell
    run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-alpha.json --script {{ inputs.courseware_script }} --storyboard {{ inputs.storyboard }} --concepts {{ inputs.concepts }}"

  # Alpha is deterministic aggregation of per-page reviews plus the gates
  # above. There is no separate whole-deck human gate.

  # ---------- beta / gold ----------
  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.lesson }} --lesson-slug {{ inputs.lesson_slug }}"

  - id: self-review-beta
    type: shell
    run: "node workflow/tools/build-self-review-beta.mjs --lesson-slug {{ inputs.lesson_slug }} --report review/{{ inputs.lesson_slug }}/converge-report.md --out review/{{ inputs.lesson_slug }}/self-review-beta.json --md review/{{ inputs.lesson_slug }}/self-review-beta.md"

  - id: check-self-review-beta
    type: shell
    run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-beta.json"

  # Beta is a deterministic converge report + checks; no separate human gate.

  - id: gold-script-gates
    type: shell
    run: "node workflow/tools/check-script.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.style_pack }} {{ inputs.component_registry }}"

  - id: gold-concepts-gate
    type: shell
    run: "node workflow/tools/check-concepts.mjs {{ inputs.courseware_script }} {{ inputs.content_pack }} {{ inputs.storyboard }} --concepts {{ inputs.concepts }}"

  - id: gold-quiz-keys-gate
    type: shell
    run: "node workflow/tools/check-quiz-keys.mjs {{ inputs.deck_data }}"

  - id: gold-parity-gate
    type: shell
    run: "node workflow/tools/script-to-storyboard.mjs {{ inputs.courseware_script }} --check {{ inputs.storyboard }}"

  - id: final-gates
    type: shell
    run: "node workflow/tools/check-overflow.mjs {{ inputs.deck_url }} --script {{ inputs.courseware_script }} --pages {{ inputs.page_count }}"

  - id: gold-shell-gate
    type: shell
    run: "node workflow/tools/check-shell.mjs --shell {{ inputs.shell }} --site {{ inputs.site_dir }} --require-art"

  - id: gold-shell-art-gate
    type: shell
    run: "node workflow/tools/check-shell-art.mjs --shell {{ inputs.shell }} --art {{ inputs.art_dir }}/art-manifest.json --site {{ inputs.site_dir }} --require-all"

  - id: self-review-gold
    type: shell
    run: "node workflow/tools/build-self-review-gold.mjs --lesson-slug {{ inputs.lesson_slug }} --script {{ inputs.courseware_script }} --storyboard {{ inputs.storyboard }} --content {{ inputs.content_pack }} --style {{ inputs.style_pack }} --concepts {{ inputs.concepts }} --registry {{ inputs.component_registry }} --deck {{ inputs.deck_data }} --review-dir review/{{ inputs.lesson_slug }} --alpha review/{{ inputs.lesson_slug }}/self-review-alpha.json --out review/{{ inputs.lesson_slug }}/self-review-gold.json --md review/{{ inputs.lesson_slug }}/self-review-gold.md"

  - id: check-self-review-gold
    type: shell
    run: "node workflow/tools/check-self-review.mjs review/{{ inputs.lesson_slug }}/self-review-gold.json --concepts {{ inputs.concepts }}"

  # Gold is the final deterministic regression aggregation. The teacher has
  # already reviewed the shell, the whole script, and every page; there is no
  # separate whole-course sign-off gate.
