<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互动课堂</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9dfe9; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #canvas {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
  }
  #frame { width: 1440px; height: 900px; border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="canvas"><iframe id="frame" src="./index.html" allow="autoplay; fullscreen" title="课件"></iframe></div>
</div>
<script>
  const stage = document.getElementById('stage')
  const canvas = document.getElementById('canvas')
  const frame = document.getElementById('frame')

  function fit () {
    // The iframe keeps a 1440×900 viewport. Only the outer canvas is scaled,
    // so browser zoom and window size never reflow the courseware.
    const scale = Math.max(
      0.1,
      Math.min(stage.clientWidth / 1440, stage.clientHeight / 900),
    )
    canvas.style.transform = `translate(-50%, -50%) scale(${scale})`
  }

  function toggleFullscreen () {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {})
    else stage.requestFullscreen().catch(() => {})
  }

  // The shell already has a fullscreen button and "f" shortcut. Route both to
  // the wrapper's stage fullscreen so the 1440×900 canvas is scaled, not
  // reflowed by the iframe viewport.
  let hookedDoc = null
  function hookFrame () {
    try {
      const doc = frame.contentDocument
      if (!doc) return
      // Extend the courseware background into the letterbox: use the stage's
      // own background color/image, not a separate player color. The central
      // 1440×900 iframe still renders the exact courseware layout.
      const bodyStyle = doc.defaultView.getComputedStyle(doc.body)
      const slide = doc.querySelector('#slide')
      const slideStyle = slide ? doc.defaultView.getComputedStyle(slide) : null
      const background =
        slideStyle?.backgroundColor && slideStyle.backgroundColor !== 'rgba(0, 0, 0, 0)'
          ? slideStyle.backgroundColor
          : bodyStyle.backgroundColor
      const image =
        slideStyle?.backgroundImage && slideStyle.backgroundImage !== 'none'
          ? slideStyle.backgroundImage
          : bodyStyle.backgroundImage
      for (const target of [document.body, stage]) {
        if (background && background !== 'rgba(0, 0, 0, 0)') {
          target.style.backgroundColor = background
        }
        if (image && image !== 'none') {
          target.style.backgroundImage = image
          target.style.backgroundSize = 'cover'
          target.style.backgroundPosition = 'center'
          target.style.backgroundRepeat = 'no-repeat'
        }
      }
      const button = doc.getElementById('fullscreenBtn')
      if (button) button.onclick = toggleFullscreen
      if (hookedDoc !== doc) {
        hookedDoc = doc
        doc.addEventListener(
          'keydown',
          (event) => {
            if (event.key.toLowerCase() !== 'f') return
            if (event.target.closest('input,select,textarea,button')) return
            event.preventDefault()
            event.stopPropagation()
            event.stopImmediatePropagation()
            toggleFullscreen()
          },
          true,
        )
      }
      frame.focus()
    } catch {
      // file:// or cross-origin: scaling still works; only the fullscreen
      // shortcut override is unavailable.
    }
  }

  frame.addEventListener('load', hookFrame)
  addEventListener('resize', fit)
  addEventListener('fullscreenchange', fit)
  fit()
  setTimeout(hookFrame, 500)
</script>
</body>
</html>
