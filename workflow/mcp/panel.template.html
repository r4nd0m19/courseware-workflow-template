<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="courseware-gate-token" content="__PANEL_TOKEN__">
<title>课件人工审核</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f0e8;
    --card: #fffdf7;
    --card-2: #f7f3e9;
    --fg: #211d15;
    --muted: #6b6353;
    --line: #d8d0bf;
    --line-strong: #bfb5a0;
    --accent: #1d5c46;
    --accent-fg: #f7f3e8;
    --accent-soft: #e2ede7;
    --reject: #8a3a2c;
    --reject-soft: #f5e4df;
    --ok: #1d5c46;
    --warn: #8a5a1c;
    --err: #8a3a2c;
    --shadow: 0 1px 2px rgba(45, 36, 20, .08), 0 8px 24px rgba(45, 36, 20, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #15130e;
      --card: #201d16;
      --card-2: #262219;
      --fg: #f0eadb;
      --muted: #aaa08a;
      --line: #3d372a;
      --line-strong: #554c3a;
      --accent: #7fc7a5;
      --accent-fg: #10241b;
      --accent-soft: #24382e;
      --reject: #e39a85;
      --reject-soft: #3a2620;
      --ok: #7fc7a5;
      --warn: #d6a55e;
      --err: #e39a85;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15130e;
    --card: #201d16;
    --card-2: #262219;
    --fg: #f0eadb;
    --muted: #aaa08a;
    --line: #3d372a;
    --line-strong: #554c3a;
    --accent: #7fc7a5;
    --accent-fg: #10241b;
    --accent-soft: #24382e;
    --reject: #e39a85;
    --reject-soft: #3a2620;
    --ok: #7fc7a5;
    --warn: #d6a55e;
    --err: #e39a85;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 14px/1.55 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    padding: 14px;
  }
  .card {
    max-width: 760px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px 16px;
  }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.25;
    text-wrap: balance;
    letter-spacing: -.01em;
  }
  .subtitle {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card-2);
    color: var(--muted);
    font-size: 11px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    overflow-wrap: anywhere;
  }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .badge.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .message {
    margin: 16px 0 0;
    padding: 12px 14px;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 6px 11px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--accent);
    background: var(--card);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .links a:hover { background: var(--accent-soft); }
  .links .url { color: var(--muted); font-weight: 400; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  details {
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-2);
  }
  summary {
    cursor: pointer;
    padding: 10px 13px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .02em;
    user-select: none;
  }
  summary:hover { color: var(--fg); }
  summary .count { font-weight: 400; font-family: ui-monospace, Consolas, monospace; }
  .files { padding: 0 13px 10px; display: grid; gap: 1px; max-height: 150px; overflow: auto; }
  .file {
    display: grid;
    grid-template-columns: minmax(58px, max-content) minmax(0, 1fr);
    gap: 8px;
    padding: 5px 0;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
  }
  .file:first-child { border-top: 0; }
  .file .role {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: 9.5px;
    font-weight: 700;
    padding-top: 2px;
  }
  .file .path { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
  .file .hash { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 10px; }
  .more { padding: 7px 0 2px; color: var(--muted); font-size: 11px; border-top: 1px dashed var(--line); }
  .review-file { margin: 0; padding: 0 13px 12px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .review-file code { font-family: ui-monospace, Consolas, monospace; color: var(--fg); }
  #excerpt {
    margin: 0;
    padding: 0 13px 13px;
    max-height: 260px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 11.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--fg);
  }
  .empty {
    margin-top: 16px;
    padding: 18px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  button {
    font: inherit;
    font-weight: 650;
    border-radius: 9px;
    padding: 9px 17px;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--card);
    color: var(--fg);
    transition: background .12s ease, transform .05s ease;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  button.reject { color: var(--reject); border-color: color-mix(in srgb, var(--reject) 55%, var(--line)); background: var(--reject-soft); }
  button:disabled { opacity: .5; cursor: default; }
  .status {
    margin: 14px 0 0;
    min-height: 1.5em;
    font-size: 12.5px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.warn { color: var(--warn); }
  .hint {
    margin: 10px 0 0;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    color: var(--muted);
    font-size: 11px;
  }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .card { padding: 14px 13px 12px; border-radius: 12px; }
    h1 { font-size: 18px; }
    .actions { display: grid; grid-template-columns: 1fr; }
    button { width: 100%; }
  }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">人工审核 · 课件工作流</p>
  <h1 id="title">等待审核请求…</h1>
  <p class="subtitle" id="subtitle">正在连接 ZCode host。</p>
  <div class="badges">
    <span class="badge" id="runBadge">run —</span>
    <span class="badge" id="stepBadge">step —</span>
    <span class="badge" id="stateBadge">连接中</span>
  </div>

  <section id="gate" hidden>
    <p class="message" id="message"></p>
    <div class="links" id="links"></div>
    <details id="evidence" open>
      <summary>审核材料 <span class="count" id="fileCount"></span></summary>
      <div class="files" id="files"></div>
    </details>
    <details id="excerptBox">
      <summary>审核文件摘录</summary>
      <pre id="excerpt"></pre>
    </details>
  </section>

  <section id="empty" class="empty">工作流正在运行，等待下一个审核闸门…</section>

  <div class="actions" id="actions"></div>
  <p class="status" id="status">正在连接 ZCode host…</p>
  <p class="hint">只有在这个面板里点击才会记录审核结果。Agent 不能代答；面板外的按钮或工具调用都会被 server 拒绝。</p>
</main>

<script type="module">
/*__MCP_APP_BUNDLE__*/
</script>

<script type="module">
const { App } = globalThis.__MCP_APPS__ || {};
const $ = (id) => document.getElementById(id);
const els = {
  title: $('title'), subtitle: $('subtitle'),
  runBadge: $('runBadge'), stepBadge: $('stepBadge'), stateBadge: $('stateBadge'),
  gate: $('gate'), message: $('message'), links: $('links'),
  fileCount: $('fileCount'), files: $('files'),
  excerpt: $('excerpt'), empty: $('empty'), actions: $('actions'),
  status: $('status'),
};
const panelToken = document.querySelector('meta[name="courseware-gate-token"]')?.content || '';

let connected = false;
let app = null;
let runId = '';
let gateKey = '';
let nonce = '';
let currentGate = null;
let busy = false;
let finished = false;
let polling = false;
let pollTimer = null;
let lastRenderKey = '';

const STEP_LABELS = {
  'review-shell': '壳审核',
  'review-inputs': '输入审核',
  'review-brief': '教学简报审核',
  'review-self-study-audit': '自学补充审核',
  'review-script': '课件脚本审核',
  'review-shell-art': '壳插画审核',
  'review-component-plan': '组件计划审核',
  'review-storyboard': '分镜审核',
  'review-tasks': '任务清单审核',
  'review-page': '页面审核',
  'review-alpha': 'Alpha 阶段审核',
  'review-beta': 'Beta 阶段审核',
  'gold': 'Gold 阶段审核',
};
const STATUS_TEXT = {
  pending: '等待人工选择',
  deciding: '已提交，工作流继续中',
  running: '工作流运行中',
  paused: '工作流已暂停',
  completed: '工作流已完成',
  failed: '工作流失败',
  aborted: '工作流已中止',
  idle: '没有待处理审核',
};

function setStatus(text, kind = '') {
  els.status.textContent = text;
  els.status.className = `status ${kind}`.trim();
}

function setStateBadge(text, kind = '') {
  els.stateBadge.textContent = text;
  els.stateBadge.className = `badge ${kind}`.trim();
}

function parseStructured(result) {
  let value = result && result.structuredContent;
  if (typeof value === 'string') {
    try { value = JSON.parse(value); } catch { value = null; }
  }
  return value && typeof value === 'object' ? value : {};
}

function resultText(result) {
  const content = result && Array.isArray(result.content) ? result.content : [];
  const text = content.find((item) => item && item.type === 'text');
  return text && typeof text.text === 'string' ? text.text : '';
}

function stepLabel(stepId) {
  if (!stepId) return '审核';
  const base = String(stepId).split(':').pop();
  return STEP_LABELS[base] || base;
}

function shortHash(hash) {
  return typeof hash === 'string' && hash.length > 16 ? `${hash.slice(0, 12)}…` : (hash || '');
}

function roleLabel(role) {
  return ({ show: '审核文件', review: '自查记录', reviewed: '被审材料', artifact: '材料' })[role] || role || '材料';
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function addText(parent, tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  parent.appendChild(node);
  return node;
}

function renderLinks(links) {
  clear(els.links);
  const valid = (Array.isArray(links) ? links : []).filter(
    (link) => link && typeof link.url === 'string' && /^https?:\/\//i.test(link.url),
  );
  for (const link of valid.slice(0, 4)) {
    const anchor = document.createElement('a');
    anchor.href = link.url;
    anchor.target = '_blank';
    anchor.rel = 'noreferrer noopener';
    anchor.textContent = link.label || '打开链接';
    const url = addText(anchor, 'span', link.url, 'url');
    url.title = link.url;
    anchor.addEventListener('click', (event) => {
      if (app && typeof app.openLink === 'function') {
        event.preventDefault();
        Promise.resolve(app.openLink({ url: link.url })).catch(() => {
          window.open(link.url, '_blank', 'noopener,noreferrer');
        });
      }
    });
    els.links.appendChild(anchor);
  }
  els.links.hidden = valid.length === 0;
}

function renderFiles(gate) {
  clear(els.files);
  const files = Array.isArray(gate.files) ? gate.files : [];
  els.fileCount.textContent = files.length ? `（${files.length} 个文件，均已绑定 SHA-256）` : '（无文件）';
  const shown = files.slice(0, 10);
  for (const file of shown) {
    const row = addText(els.files, 'div', undefined, 'file');
    addText(row, 'span', roleLabel(file.role), 'role');
    const body = addText(row, 'span', undefined, 'path');
    addText(body, 'span', file.path || '');
    addText(body, 'div', `sha256 ${shortHash(file.sha256)} · ${Number(file.size || 0).toLocaleString()} B`, 'hash');
  }
  if (files.length > shown.length) {
    addText(els.files, 'div', `还有 ${files.length - shown.length} 个文件…`, 'more');
  }
}

function rejectLabel(onReject) {
  if (onReject === 'abort') return '拒绝并中止';
  if (onReject === 'retry') return '拒绝并重试';
  if (onReject === 'skip') return '拒绝并跳过';
  return '拒绝';
}

function optionLabel(option, gate) {
  const lower = String(option).toLowerCase();
  if (lower === 'approve') return '批准并继续';
  if (lower === 'reject') return rejectLabel(gate.onReject);
  if (lower === 'abort') return '中止';
  return option;
}

function renderActions(gate, forceEnabled) {
  clear(els.actions);
  const options = Array.isArray(gate.options) && gate.options.length ? gate.options : ['approve', 'reject'];
  const enabled = Boolean(forceEnabled && connected && gate.nonce && !busy);
  for (const option of options) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = optionLabel(option, gate);
    const lower = String(option).toLowerCase();
    if (lower === 'approve') button.className = 'primary';
    else if (lower === 'reject' || lower === 'abort') button.className = 'reject';
    button.disabled = !enabled;
    button.addEventListener('click', () => sendVerdict(option));
    els.actions.appendChild(button);
  }
  els.actions.hidden = false;
}

function renderGate(gate, responseStatus) {
  const effective = responseStatus || gate.status || 'pending';
  currentGate = gate;
  gateKey = gate.gateKey || '';
  nonce = gate.nonce || '';
  runId = gate.runId || runId;
  els.gate.hidden = false;
  els.empty.hidden = true;
  els.title.textContent = stepLabel(gate.stepId);
  els.subtitle.textContent = gate.showFile
    ? `审核文件：${gate.showFile}`
    : '请核对下方说明后再选择。';
  els.runBadge.textContent = `run ${gate.runId || '—'}`;
  els.stepBadge.textContent = `step ${gate.stepId || '—'}`;
  els.message.textContent = gate.message || '请审核这份材料。';
  renderLinks(gate.links);
  renderFiles(gate);
  els.excerpt.textContent = gate.reviewExcerpt || '（没有可显示的审核文件摘录）';
  const pending = effective === 'pending' && gate.status === 'pending';
  renderActions(gate, pending);
  const kind = pending ? 'warn' : (['failed', 'aborted', 'rejected'].includes(effective) ? 'err' : 'ok');
  setStateBadge(STATUS_TEXT[effective] || effective || '等待审核', kind);
  if (pending) {
    setStatus('等待你在这个面板里选择。Agent 不能代答。', '');
  } else if (effective === 'deciding' || gate.status === 'decided') {
    setStatus('审核结果已提交，工作流正在继续…', 'ok');
  } else if (gate.status === 'rejected') {
    setStatus('审核已拒绝，工作流已中止。', 'err');
  } else if (gate.status === 'stale') {
    setStatus('这个审核请求已失效，等待新的审核请求…', 'warn');
  } else {
    setStatus(`这个审核请求的状态是 ${gate.status || effective}。`, '');
  }
  lastRenderKey = `${gate.gateKey}:${gate.nonce}:${effective}`;
}

function renderEmpty(status, run, detail) {
  currentGate = null;
  els.gate.hidden = true;
  els.empty.hidden = false;
  els.actions.hidden = true;
  clear(els.actions);
  const label = STATUS_TEXT[status] || status || '等待审核';
  els.title.textContent = status === 'running' || status === 'idle'
    ? '等待审核请求…'
    : `工作流${label.replace(/^工作流/, '')}`;
  els.subtitle.textContent = run && run.currentStepId
    ? `当前步骤：${run.currentStepId}`
    : '面板会持续轮询；工作流到达审核闸门时会自动显示。';
  if (run) {
    els.runBadge.textContent = `run ${run.runId || '—'}`;
    els.stepBadge.textContent = `step ${run.currentStepId || '—'}`;
  }
  const kind = status === 'completed' ? 'ok' : (['failed', 'aborted'].includes(status) ? 'err' : '');
  setStateBadge(label, kind);
  const messages = {
    running: '工作流正在继续运行，等待下一个审核闸门…',
    deciding: '审核结果已提交，工作流正在继续…',
    paused: '工作流已暂停，但没有可用的审核面板。请查看 review/gui-gates/server.log 与工作流输出。',
    completed: '本次工作流已完成。',
    failed: `工作流失败${run && run.error ? `：${run.error}` : '。'}`,
    aborted: '工作流已中止。',
    idle: '没有待处理的审核。',
  };
  els.empty.textContent = messages[status] || detail || '等待工作流到达审核闸门…';
  if (status === 'paused' || status === 'failed' || status === 'aborted') {
    setStatus(els.empty.textContent, status === 'paused' ? 'warn' : 'err');
  } else {
    setStatus(messages[status] || '等待工作流到达审核闸门…', status === 'completed' ? 'ok' : '');
  }
  lastRenderKey = `empty:${status}`;
}

function renderRunBadges(run) {
  if (!run) return;
  runId = run.runId || runId;
  els.runBadge.textContent = `run ${run.runId || '—'}`;
  els.stepBadge.textContent = `step ${run.currentStepId || '—'}`;
}

function applyPayload(data) {
  if (!data || typeof data !== 'object') return;
  if (data.run) renderRunBadges(data.run);
  if (data.runId && !runId) runId = data.runId;
  const status = typeof data.status === 'string' ? data.status : 'idle';

  if (data.gate && typeof data.gate === 'object') {
    if (status === 'pending') busy = false;
    else if (status === 'deciding') busy = true;
    renderGate(data.gate, status);
  } else {
    renderEmpty(status, data.run || null, resultText(data));
    if (status === 'completed' || status === 'failed' || status === 'aborted') {
      finished = true;
    }
  }
}

async function sendVerdict(choice) {
  if (busy || !connected || !gateKey || !nonce || !currentGate) return;
  busy = true;
  renderActions(currentGate, false);
  setStatus(`正在写回：${choice} …`, '');
  try {
    const result = await app.callServerTool({
      name: 'courseware_gate_verdict',
      arguments: { choice, nonce, gateKey, panelToken, runId },
    });
    const data = parseStructured(result);
    if (data.accepted === true) {
      setStatus(
        `已记录：${data.choice || choice}（${data.recordedAt || '已记录'}）。工作流正在继续…`,
        'ok',
      );
      setStateBadge('已提交，继续中', 'ok');
      schedulePoll(300);
      return;
    }
    const error = data.error || (result && result.isError ? 'unknown-error' : 'not-accepted');
    if (error === 'stale-nonce' || error === 'already-decided' || error === 'gate-consumed') {
      setStatus('审核请求已经更新，正在刷新…', 'warn');
      busy = false;
      schedulePoll(100);
      return;
    }
    if (error === 'run-not-at-gate' || error === 'gate-not-paused' || error === 'run-state-missing') {
      setStatus(`工作流已经不在这个审核点（${error}），正在刷新…`, 'warn');
      busy = false;
      schedulePoll(100);
      return;
    }
    if (error === 'panel-token-mismatch') {
      setStatus('面板令牌不匹配。请让工作流重新打开审核面板；不要用 agent 代答。', 'err');
      busy = false;
      renderActions(currentGate, false);
      return;
    }
    if (error === 'verdict-busy') {
      setStatus('另一个审核请求正在写入，请稍后重试。', 'warn');
      busy = false;
      renderActions(currentGate, true);
      return;
    }
    setStatus(`server 未接受：${error}`, 'err');
    busy = false;
    renderActions(currentGate, true);
  } catch (error) {
    setStatus(`写回失败：${error.message}`, 'err');
    busy = false;
    renderActions(currentGate, true);
  }
}

function schedulePoll(delay = 1500) {
  if (pollTimer) clearTimeout(pollTimer);
  if (finished) return;
  pollTimer = setTimeout(poll, delay);
}

async function poll() {
  if (!connected || finished || polling) return;
  polling = true;
  try {
    const result = await app.callServerTool({
      name: 'courseware_gate_next',
      arguments: runId ? { runId } : {},
    });
    const data = parseStructured(result);
    applyPayload(data);
  } catch (error) {
    if (!finished) setStatus(`轮询失败：${error.message}（会自动重试）`, 'warn');
  } finally {
    polling = false;
    if (!finished) schedulePoll(1500);
  }
}

function applyToolResult(result) {
  const data = parseStructured(result);
  if (result && result.isError && !data.status) {
    setStatus(resultText(result) || '审核面板不可用。', 'err');
    setStateBadge('面板不可用', 'err');
    return;
  }
  applyPayload(data);
}

if (!App) {
  setStatus('未加载到 MCP App 运行时；审核面板无法连接。', 'err');
  setStateBadge('运行时缺失', 'err');
} else {
  app = new App(
    { name: 'Courseware Approval Panel', version: '1.0.0' },
    { tools: {} },
    { autoResize: true },
  );

  app.ontoolresult = (result) => {
    try {
      applyToolResult(result);
    } catch (error) {
      setStatus(`读取工具结果失败：${error.message}`, 'err');
    }
  };

  (async () => {
    try {
      await app.connect();
      connected = true;
      setStateBadge('已连接，等待审核', 'warn');
      setStatus('已连接 ZCode host。等待审核请求…', '');
      schedulePoll(500);
    } catch (error) {
      setStateBadge('连接失败', 'err');
      setStatus(`连接 host 失败：${error.message}`, 'err');
    }
  })();
}
</script>
